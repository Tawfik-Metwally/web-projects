name: benchledger

x-app-base: &app-base
  build:
    context: .
  working_dir: /workspace
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://benchledger:benchledger_local@db:5432/benchledger}
    API_PORT: ${API_PORT:-3000}
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}

services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchledger}
      POSTGRES_USER: ${POSTGRES_USER:-benchledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchledger_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    <<: *app-base
    command: pnpm --filter @benchledger/api dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *app-base
    command: pnpm --filter @benchledger/web dev --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    <<: *app-base
    profiles: ["tools"]
    command: pnpm verify
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
