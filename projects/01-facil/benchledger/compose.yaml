name: benchledger

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-base: &app-base
  build:
    context: .
  working_dir: /workspace
  init: true
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://benchledger:benchledger_local@db:5432/benchledger}
    API_PORT: 3000
    WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}

services:
  db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    init: true
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchledger}
      POSTGRES_USER: ${POSTGRES_USER:-benchledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benchledger_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    <<: *app-base
    command: >-
      sh -c "pnpm --filter @benchledger/api prisma:migrate &&
      pnpm --filter @benchledger/api dev"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    <<: *app-base
    command: pnpm --filter @benchledger/web dev --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    <<: *app-base
    profiles: ["tools"]
    command: pnpm verify
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
