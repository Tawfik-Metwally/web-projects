spring.application.name=payment-sandbox-api

# Dev Container inputs. The packaged API can still override these with
# SPRING_DATASOURCE_*; Testcontainers supplies its own connection details.
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://postgres:5432/payments}
spring.datasource.username=${APP_DB_USER:payments}
spring.datasource.password=${APP_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# The issuer is the public URL carried by tokens obtained from the host.
# The JWK Set uses the internal Compose address so containers do not depend
# on host port forwarding to retrieve Keycloak's public signing keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/payment-sandbox}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/payment-sandbox/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=payment-sandbox-api
