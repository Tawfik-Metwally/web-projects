spring.application.name=payment-sandbox-api

# Dev Container inputs. The packaged API can still override these with
# SPRING_DATASOURCE_*; Testcontainers supplies its own connection details.
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://postgres:5432/payments}
spring.datasource.username=${APP_DB_USER:payments}
spring.datasource.password=${APP_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Request logs carry only controlled operational fields. The trace ID is kept in
# MDC for the lifetime of a request and appears as "none" outside that context.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [traceId=%X{traceId:-none}] %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# OpenAPI documents only the merchant-facing contract. Actuator remains outside
# the generated specification and Swagger UI never persists bearer tokens.
springdoc.paths-to-match=/api/v1/**
springdoc.show-actuator=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# The issuer is the public URL carried by tokens obtained from the host.
# The JWK Set uses the internal Compose address so containers do not depend
# on host port forwarding to retrieve Keycloak's public signing keys.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/payment-sandbox}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/payment-sandbox/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=payment-sandbox-api
