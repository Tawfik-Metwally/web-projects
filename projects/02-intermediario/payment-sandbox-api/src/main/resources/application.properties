spring.application.name=payment-sandbox-api

# Dev Container inputs. The packaged API can still override these with
# SPRING_DATASOURCE_*; Testcontainers supplies its own connection details.
spring.datasource.url=${APP_DB_URL:jdbc:postgresql://postgres:5432/payments}
spring.datasource.username=${APP_DB_USER:payments}
spring.datasource.password=${APP_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
