name: BenchLedger CI

on:
  push:
    paths:
      - "projects/01-facil/benchledger/**"
      - ".github/workflows/benchledger-ci.yml"
  pull_request:
    paths:
      - "projects/01-facil/benchledger/**"
      - ".github/workflows/benchledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/01-facil/benchledger

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build reproducible images
        run: docker compose build app api web

      - name: Run static checks and automated tests
        run: docker compose run --rm --no-deps app pnpm verify

      - name: Start isolated application
        run: docker compose up -d --wait db api web

      - name: Run critical end-to-end flow
        run: >-
          docker compose run --rm --no-deps
          -e E2E_API_URL=http://api:3000/api
          -e E2E_WEB_URL=http://web:5173
          app pnpm e2e

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop isolated application
        if: always()
        run: docker compose down --volumes --remove-orphans
